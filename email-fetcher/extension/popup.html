<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Fetcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Email Fetcher</h1>
      <p class="subtitle">Search emails by recipient or keywords</p>
    </div>

    <form id="searchForm">
      <div class="form-group">
        <label for="server">Email Provider</label>
        <select id="server" required>
          <option value="gmail">Gmail (OAuth2)</option>
          <option value="outlook">Outlook (Password)</option>
          <option value="yahoo">Yahoo (Password)</option>
        </select>
      </div>

      <div id="gmailSection">
        <div class="oauth-box" id="oauthBox">
          <div id="oauthStatus">
            <p class="oauth-text">Sign in with your Google account</p>
            <button type="button" id="googleSignIn" class="btn-google">
              <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332Z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.166 6.656 3.58 9 3.58Z"/></svg>
              Sign in with Google
            </button>
          </div>
          <div id="oauthSuccess" class="hidden">
            <p class="oauth-connected">Connected to Google</p>
            <button type="button" id="googleSignOut" class="btn-signout">Sign Out</button>
          </div>
        </div>
      </div>

      <div id="passwordSection" class="hidden">
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" placeholder="you@outlook.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
      </div>

      <div class="form-group">
        <label for="recipient">Recipient Name or Email</label>
        <input type="text" id="recipient" placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label for="keywords">Keywords (comma-separated)</label>
        <input type="text" id="keywords" placeholder="invoice, meeting, report">
      </div>

      <button type="submit" id="searchBtn">
        <span class="btn-text">Search Emails</span>
        <span class="btn-loading hidden">Searching...</span>
      </button>
    </form>

    <div id="error" class="error hidden"></div>

    <div id="results" class="results hidden">
      <div class="results-header">
        <h2>Results</h2>
        <span id="resultCount" class="badge">0</span>
      </div>
      <div id="emailList" class="email-list"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
